# Conservative starting point for local Irodori-TTS-v4.1-Small LoRA fine-tuning.
# This config is unvalidated for available GPU memory and is not a launch approval.
model:
  latent_dim: 32
  latent_patch_size: 1
  text_vocab_size: 102400
  text_tokenizer_repo: sbintuitions/modernbert-ja-310m
  text_encoder_revision: 77675fc96a7e445e982e2ba90246b816efc74ec6
  text_encoder_type: pretrained
  text_add_bos: true
  pretrained_projector_type: residual_mlp
  pretrained_projector_hidden_ratio: 2.0
  pretrained_projector_dropout: 0.0
  model_dim: 1280
  num_layers: 12
  num_heads: 20
  mlp_ratio: 2.875
  speaker_mlp_ratio: 2.6
  text_dim: 512
  speaker_dim: 768
  speaker_layers: 8
  speaker_heads: 12
  speaker_patch_size: 4
  timestep_embed_dim: 512
  adaln_rank: 192
  use_caption_condition: true
  use_speaker_condition: true
  caption_vocab_size: 102400
  caption_tokenizer_repo: sbintuitions/modernbert-ja-310m
  caption_add_bos: true
  caption_dim: 512
  use_duration_predictor: true
  duration_aux_dim: 14
  duration_hidden_dim: 1024
  duration_layers: 3
  duration_dropout: 0.1
  duration_attention_heads: 8
  duration_architecture: token_sum_dual_adarn_zero_no_aux
  duration_token_init_frames: 9.0
  duration_speaker_fusion: adarn_zero
  duration_caption_fusion: adarn_zero
  duration_caption_pooling: masked_mean

train:
  train_mode: rf
  output_dir: outputs/dataset/training-v2/irodori/run-v2
  batch_size: 2
  gradient_accumulation_steps: 4
  num_workers: 0
  dataloader_persistent_workers: false
  dataloader_cuda_prefetch: false
  length_bucket_enabled: true
  allow_tf32: false
  compile_model: false
  gradient_checkpointing: true
  precision: bf16
  optimizer: adamw
  learning_rate: 0.00005
  pretrained_text_encoder_learning_rate: 0.00001
  weight_decay: 0.01
  lr_scheduler: wsd
  warmup_steps: 25
  stable_steps: 375
  min_lr_scale: 0.01
  max_steps: 500
  max_text_len: 256
  max_caption_len: 512
  max_latent_steps: 750
  fixed_target_latent_steps: null
  fixed_target_full_mask: false
  ref_min_seconds: 1.0
  ref_max_seconds: 120.0
  rf_loss_mode: utterance_mean
  duration_loss_weight: 1.0
  duration_backprop_to_condition: false
  log_every: 10
  save_every: 100
  checkpoint_best_n: 2
  wandb_enabled: false
  wandb_mode: disabled
  valid_ratio: 0.1
  valid_every: 50
  lora_enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_bias: none
  lora_target_modules: diffusion_attn
  lora_modules_to_save: auto
  seed: 0
